[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mornork"
version = "0.1.0"
description = "Default small language model and expert router"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch", "transformers", "safetensors", "huggingface_hub", "fastapi>=0.115", "uvicorn>=0.32", "boto3>=1.35"]

[project.optional-dependencies]
accelerate = ["accelerate"]
routing = ["sentence-transformers"]
training = ["accelerate>=1.0", "peft>=0.13", "pypdf>=5.0"]

[project.scripts]
mornork-upcycle = "mornork.modeling.upcycle:main"
mornork-route = "mornork.routing.cli:main"
mornork-web = "mornork.web:main"
mornork-calibrate = "mornork.routing.calibrate:main"

[tool.setuptools.packages.find]
where = ["src"]

